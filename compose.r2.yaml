name: linkparcel-r2

services:
  app:
    build:
      context: .
    restart: unless-stopped
    environment:
      LPC_STORAGE_URI: "${LPC_STORAGE_URI:?set LPC_STORAGE_URI via --env-file}"
      LPC_API_TOKEN: "${LPC_API_TOKEN:?set LPC_API_TOKEN via --env-file}"
      LPC_UPLOAD_URL_TTL_SECONDS: "${LPC_UPLOAD_URL_TTL_SECONDS:-300}"
      LPC_DOWNLOAD_URL_TTL_SECONDS: "${LPC_DOWNLOAD_URL_TTL_SECONDS:-3600}"
    ports:
      - "59000:59000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:59000/openapi.json', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 10
