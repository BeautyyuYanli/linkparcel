services:
  app:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      seaweedfs:
        condition: service_healthy
    environment:
      LPC_STORAGE_URI: "s3://${S3_BUCKET:-lpc}?endpoint=http%3A%2F%2Fseaweedfs.localhost%3A59001&region=us-east-1&access_key_id=${AWS_ACCESS_KEY_ID:-lpcdev}&secret_access_key=${AWS_SECRET_ACCESS_KEY:-lpc-seaweedfs-password}"
      LPC_API_TOKEN: "${LPC_API_TOKEN:?set LPC_API_TOKEN in .env}"
      LPC_UPLOAD_URL_TTL_SECONDS: "${LPC_UPLOAD_URL_TTL_SECONDS:-300}"
      LPC_DOWNLOAD_URL_TTL_SECONDS: "${LPC_DOWNLOAD_URL_TTL_SECONDS:-3600}"
    ports:
      - "59000:59000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:59000/openapi.json', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 10

  seaweedfs:
    image: chrislusf/seaweedfs:4.37
    restart: unless-stopped
    # Keep S3 on the same port inside/outside Docker for presigned URLs.
    # Set gRPC explicitly: its default S3 port + 10000 would exceed 65535.
    command: mini -dir=/data -ip=seaweedfs -ip.bind=0.0.0.0 -s3.port=59001 -s3.port.grpc=18333
    environment:
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-lpcdev}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-lpc-seaweedfs-password}"
      S3_BUCKET: "${S3_BUCKET:-lpc}"
    volumes:
      - seaweedfs-data:/data
    ports:
      - "59001:59001"
    networks:
      default:
        aliases:
          - seaweedfs.localhost
    healthcheck:
      # S3 can listen before mini finishes creating the configured bucket.
      test:
        - CMD-SHELL
        - >-
          wget -q -O /dev/null http://127.0.0.1:59001/status &&
          wget -q -O /dev/null "http://127.0.0.1:8888/buckets/$$S3_BUCKET/"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  seaweedfs-data:
